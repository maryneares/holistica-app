# Configuration Netlify — indique où se trouvent les fonctions serverless (le webhook Stripe)
[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Exécute automatiquement l'email de cycle de vie chaque jour à 8h UTC
[functions."send-lifecycle-emails"]
  schedule = "0 8 * * *"
